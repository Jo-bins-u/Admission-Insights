<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Admissions Marketing Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="title">Admissions Marketing Dashboard</div>
        <div class="sub">Admission season 2026–27</div>
      </div>
    </div>
    <div id="source-badge" class="badge">Synthetic demo data</div>
  </header>

  <nav class="tabs" aria-label="Dashboard sections">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="channels">Channels &amp; spend</button>
    <button data-tab="timing">Visit timing</button>
    <button data-tab="students">Students</button>
    <button data-tab="data">Data &amp; import</button>
  </nav>

  <section class="filters" id="filters" aria-label="Filters"></section>

  <main id="main"></main>

  <footer>Prototype · synthetic data only · Files are processed in your browser and are not uploaded anywhere</footer>

  <script src="app.js"></script>
</body>
</html>
